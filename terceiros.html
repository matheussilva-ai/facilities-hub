<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Terceiros — Facilities Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --v:#6E69AD;--v1:#9B97D4;--v2:#CECBF6;
  --t:#B0E0E4;--t1:#7BBFC4;--t2:#4AACB4;
  --bg:#05050F;--s0:#080818;--s1:#0C0C1E;--s2:#101028;--s3:#161630;
  --b0:rgba(110,105,173,.10);--b1:rgba(110,105,173,.18);--b2:rgba(110,105,173,.32);
  --tx:#F0EEFF;--tm:#8580B0;--td:#504C72;
  --red:#FF6B6B;--yellow:#FFB830;--green:#3BEBA8;--r:16px;
  --amber:#EF9F27;
}
html,body{min-height:100%;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 50% at 0% 0%,rgba(110,105,173,.18),transparent 60%),radial-gradient(ellipse 40% 40% at 100% 100%,rgba(176,224,228,.10),transparent 55%);}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--b0) 1px,transparent 1px),linear-gradient(90deg,var(--b0) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse 80% 80% at 50% 0%,black 30%,transparent 100%);}
.app{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:0 44px 80px;}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 18px;border-bottom:1px solid var(--b1);margin-bottom:0;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-sub{font-size:11px;color:var(--tm);letter-spacing:.04em;font-weight:500;}
.back-btn{display:flex;align-items:center;gap:7px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--tm);background:var(--s2);border:1px solid var(--b1);border-radius:999px;text-decoration:none;transition:border-color .2s,color .2s;}
.back-btn:hover{border-color:var(--b2);color:var(--tx);}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.03em;padding:28px 0 6px;}
.page-sub{font-size:13px;color:var(--tm);margin-bottom:28px;}
/* NAV */
.nav{position:sticky;top:0;z-index:20;background:rgba(5,5,15,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--b1);margin:0 -44px 36px;padding:0 44px;display:flex;align-items:center;gap:4px;}
.ni{display:flex;align-items:center;gap:7px;padding:13px 16px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--td);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s;cursor:pointer;}
.ni:hover{color:var(--tm);}
.ni.on{color:var(--v1);border-bottom-color:var(--v);}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px;}
.sc{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:16px 18px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;transition:border-color .2s;}
.sc:hover{border-color:var(--b2);}
.sc-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.sc-val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--tx);}
.sc-val.r{color:var(--red);}
.sc-val.g{color:var(--green);}
.sc-val.y{color:var(--yellow);}
.sc-lbl{font-size:11px;color:var(--tm);margin-top:4px;font-weight:500;}
/* CONTROLES */
.controls{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.month-nav{display:flex;align-items:center;gap:8px;}
.month-nav button{background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tm);cursor:pointer;font-family:'Outfit',sans-serif;transition:border-color .15s,color .15s;}
.month-nav button:hover{border-color:var(--b2);color:var(--tx);}
.month-label{font-size:15px;font-weight:700;color:var(--tx);min-width:160px;text-align:center;font-family:'JetBrains Mono',monospace;}
.copy-btn{margin-left:auto;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--tm);cursor:pointer;font-family:'Outfit',sans-serif;transition:all .15s;}
.copy-btn:hover{border-color:var(--b2);color:var(--tx);}
.copy-btn.ok{border-color:rgba(59,235,168,.4);color:var(--green);}
/* LEGEND */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tm);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
/* CALENDÁRIO */
.cal-section{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:24px;margin-bottom:24px;}
.cal-section-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--td);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.cal-section-title span{display:inline-block;width:8px;height:8px;border-radius:50%;}
.grid-header{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.grid-header div{text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--td);padding:4px 0;text-transform:uppercase;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{border:1px solid var(--b0);border-radius:10px;padding:5px;min-height:68px;background:var(--s2);cursor:pointer;transition:border-color .15s,transform .12s;}
.cal-day:hover{border-color:var(--b1);transform:translateY(-1px);}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default;pointer-events:none;}
.cal-day.today{border-color:rgba(110,105,173,.5);}
.cal-day.weekend{opacity:.38;cursor:default;pointer-events:none;}
.day-num{font-size:10px;font-weight:700;color:var(--td);margin-bottom:4px;font-family:'JetBrains Mono',monospace;}
.tech-chips{display:flex;flex-direction:column;gap:2px;}
.chip{font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--s1);border:1px solid var(--b2);border-radius:20px;width:100%;max-width:440px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.6);}
.modal-head{padding:22px 24px 16px;border-bottom:1px solid var(--b0);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--tx);}
.modal-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--b1);background:var(--s3);color:var(--tm);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:color .15s;}
.modal-close:hover{color:var(--tx);}
.modal-body{overflow-y:auto;padding:20px 24px 24px;flex:1;display:flex;flex-direction:column;gap:18px;}
.tech-block{}
.tech-block-name{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;padding:3px 8px;border-radius:6px;display:inline-block;}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.status-opt{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;border:1px solid var(--b0);cursor:pointer;font-size:12px;font-weight:500;color:var(--tm);transition:all .12s;}
.status-opt:hover{border-color:var(--b1);color:var(--tx);}
.status-opt.sel{border-color:rgba(110,105,173,.5);background:rgba(110,105,173,.12);color:var(--v2);}
.status-dot-s{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.note-input{width:100%;background:var(--s2);border:1px solid var(--b0);border-radius:8px;padding:7px 10px;font-size:11px;color:var(--tx);font-family:'Outfit',sans-serif;resize:none;outline:none;transition:border-color .15s;}
.note-input:focus{border-color:var(--b1);}
.modal-footer{padding:14px 24px 20px;border-top:1px solid var(--b0);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;}
.btn{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Outfit',sans-serif;border:1px solid var(--b1);background:transparent;color:var(--tm);transition:all .15s;}
.btn:hover{color:var(--tx);border-color:var(--b2);}
.btn.primary{background:var(--v);border-color:var(--v);color:#fff;}
.btn.primary:hover{background:var(--v1);border-color:var(--v1);}
/* SUMMARY */
.summary-section{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:24px;}
.summary-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--td);margin-bottom:16px;}
.summary-table{width:100%;border-collapse:collapse;}
.summary-table th{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--td);padding:0 10px 10px;text-align:left;}
.summary-table td{padding:8px 10px;font-size:13px;border-top:1px solid var(--b0);}
.summary-table tr:first-child td{border-top:none;}
.name-cell{font-weight:700;}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.badge-red{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.2);}
.badge-amber{background:rgba(239,159,39,.12);color:var(--amber);border:1px solid rgba(239,159,39,.2);}
.badge-green{background:rgba(59,235,168,.10);color:var(--green);border:1px solid rgba(59,235,168,.18);}
.badge-gray{background:rgba(80,76,114,.18);color:var(--tm);border:1px solid var(--b0);}
.dates-cell{font-size:11px;color:var(--td);font-family:'JetBrains Mono',monospace;}
